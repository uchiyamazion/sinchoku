<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>案件進捗ボード | シオンテクノス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF2F6;
    --grid-line: #D7E0E9;
    --paper: #FFFFFF;
    --ink: #1B2733;
    --ink-soft: #5A6B7B;
    --navy: #1F3A5F;
    --navy-soft: #DCE6F0;
    --amber: #C97A2B;
    --amber-soft: #F6E3CD;
    --green: #3F7D58;
    --green-soft: #DCEEE2;
    --red: #B3432B;
    --red-soft: #F5DCD3;
    --grey: #8A97A3;
    --grey-soft: #E4E8EC;
    --line: #C9D3DD;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'IBM Plex Sans JP', sans-serif;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--bg);
    background-size: 28px 28px;
    color: var(--ink);
    min-height:100vh;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  header{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
    padding:14px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(4px);
    position: sticky; top:0; z-index: 20;
  }
  header h1{ font-size: 17px; font-weight:700; margin:0; letter-spacing:.01em; }
  header .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .header-right{ display:flex; align-items:center; gap:8px; }
  select{
    font-family:inherit; font-size:13px; padding:9px 10px;
    border:1px solid var(--line); border-radius:6px; background:#FBFCFD; color:var(--ink);
    min-height:38px;
  }
  #searchBox{
    font-family:inherit; font-size:13px; padding:9px 12px;
    border:1px solid var(--line); border-radius:6px; background:#FBFCFD; color:var(--ink);
    width:170px; min-height:38px;
  }
  #searchBox:focus{ outline:none; border-color:var(--navy); }

  .filter-count-badge{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--navy); color:#fff; font-size:10.5px; font-weight:700;
    min-width:16px; height:16px; border-radius:8px; padding:0 4px; margin-left:2px;
  }

  .filter-panel{
    display:none; padding:16px 20px; border-bottom:1px solid var(--line);
    background: rgba(255,255,255,0.92);
  }
  .filter-panel.open{ display:block; }
  .filter-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap:12px 14px;
  }
  .filter-field{ display:flex; flex-direction:column; gap:5px; }
  .filter-field label{ font-size:11px; color:var(--ink-soft); font-weight:600; }
  .filter-field select, .filter-field input[type="text"], .filter-field input[type="number"]{ width:100%; }
  .filter-field-checkbox{ justify-content:flex-end; }
  #excludeBox{
    font-family:inherit; font-size:13px; padding:9px 10px; min-height:38px;
    border:1px solid var(--line); border-radius:6px; background:#FBFCFD; color:var(--ink);
  }
  #excludeBox:focus{ outline:none; border-color:var(--navy); }
  .amt-range{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-soft); }
  .amt-range input{
    width:100%; min-width:0; font-family:'IBM Plex Mono',monospace; font-size:12.5px; padding:9px 8px; min-height:38px;
    border:1px solid var(--line); border-radius:6px; background:#FBFCFD; color:var(--ink);
  }
  .amt-range input:focus{ outline:none; border-color:var(--navy); }
  .checkbox-label{
    display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
    white-space:nowrap; padding:9px 0;
  }
  .checkbox-label input{ cursor:pointer; width:16px; height:16px; }
  .filter-panel-actions{
    display:flex; justify-content:flex-end; gap:8px; margin-top:14px;
    padding-top:12px; border-top:1px solid var(--line);
  }
  .btn{
    border:none; cursor:pointer; font-family:inherit; font-weight:600;
    border-radius:6px; padding:9px 14px; font-size:13px;
  }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background:var(--grey-soft); }
  .btn-primary{ background:var(--navy); color:#fff; }

  #conflictBanner{
    display:none; margin:14px 28px 0; padding:11px 16px;
    background: var(--red-soft); border:1px solid var(--red); color: var(--red);
    border-radius:6px; font-size:13px; font-weight:600;
  }
  #conflictBanner span.detail{ font-weight:400; color:var(--ink); }

  .board{ display:flex; gap:16px; padding: 20px 28px 40px; overflow-x:auto; align-items:flex-start; }
  .col{
    background: rgba(255,255,255,.55); border:1px solid var(--line); border-radius:8px;
    width:266px; min-width:266px; flex-shrink:0; display:flex; flex-direction:column;
    max-height: calc(100vh - 175px);
  }
  .col.dragover{ outline:2px dashed var(--navy); outline-offset:-2px; }
  .col-head{ padding:12px 13px 10px; border-bottom:1px solid var(--line); }
  .col-head-top{ display:flex; align-items:center; justify-content:space-between; }
  .col-head .label{ font-size:13px; font-weight:700; }
  .col-head .count{ font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); background:var(--grey-soft); padding:1px 7px; border-radius:10px; }
  .col-amt{ font-size:11.5px; font-weight:600; color:var(--navy); margin-top:5px; }
  .col-amt:empty{ display:none; }

  #summaryBar{
    margin:14px 28px 0; padding:12px 16px; background:rgba(255,255,255,.75);
    border:1px solid var(--line); border-radius:8px;
    display:flex; flex-wrap:wrap; gap:20px; font-size:12.5px;
  }
  #summaryBar .s-item{ display:flex; flex-direction:column; gap:2px; }
  #summaryBar .s-label{ font-size:10.5px; color:var(--ink-soft); }
  #summaryBar .s-val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14.5px; color:var(--navy); }
  .col-body{ padding:9px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:8px; }
  .col-body:empty::after{ content:"案件なし"; display:block; text-align:center; color:var(--grey); font-size:11.5px; padding:16px 0; }

  .col[data-status=""] .col-head{ border-top:3px solid #B9C2CC; }
  .col[data-status="見積中"] .col-head{ border-top:3px solid var(--grey); }
  .col[data-status="受注"] .col-head{ border-top:3px solid var(--navy); }
  .col[data-status="工事中"] .col-head{ border-top:3px solid var(--amber); }
  .col[data-status="完了"] .col-head{ border-top:3px solid var(--green); }

  .card{
    background:var(--paper); border:1px solid var(--line); border-radius:6px;
    padding:10px 11px; cursor:grab; font-size:12.3px; box-shadow: 0 1px 2px rgba(20,30,40,.05);
    transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover{
    border-color: var(--navy);
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 10px 20px rgba(20,30,45,.12);
  }
  .card.dragging{ opacity:.4; }
  .card .branch-tag{
    display:inline-block; font-size:10px; font-weight:600; color:var(--navy);
    background:var(--navy-soft); padding:1px 6px; border-radius:8px; margin-bottom:5px;
  }
  .card .cname{ font-weight:700; font-size:12.8px; }
  .card .pname{ color:var(--ink-soft); margin:1px 0 6px; }
  .card .legacy-status{
    color:var(--ink-soft); font-size:10.8px; margin-top:5px;
    border-top:1px dashed var(--line); padding-top:5px;
  }
  .card .row{ display:flex; align-items:center; justify-content:space-between; margin-top:5px; flex-wrap:wrap; gap:4px; }
  .badge{
    display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600;
    padding:2px 7px; border-radius:10px; font-family:'IBM Plex Mono', monospace;
  }
  .badge.b-green{ background:var(--green-soft); color:var(--green); }
  .badge.b-amber{ background:var(--amber-soft); color:var(--amber); }
  .badge.b-red{ background:var(--red-soft); color:var(--red); }
  .badge.b-grey{ background:var(--grey-soft); color:var(--ink-soft); }
  .amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--ink); font-size:12px; }
  .conflict-flag{ color:var(--red); font-weight:700; font-size:10.5px; margin-top:6px; display:flex; align-items:center; gap:4px; }
  .updated-at{ color:var(--grey); font-size:9.5px; margin-top:5px; }
  .updated-flag{
    color:var(--amber); font-weight:700; font-size:10.5px; margin-bottom:4px;
  }
  .card.just-updated{
    animation: updatedPulse 3s ease-out;
    border-color: var(--amber);
  }
  @keyframes updatedPulse{
    0%{ background: var(--amber-soft); }
    100%{ background: var(--paper); }
  }

  .confetti-container{
    position:fixed; inset:0; pointer-events:none; z-index:200; overflow:hidden;
  }
  .confetti-piece{
    position:absolute; top:-20px; width:8px; height:14px; opacity:0.9;
    animation-name: confettiFall; animation-timing-function: ease-in; animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translateY(0) rotate(0deg); opacity:1; }
    100%{ transform: translateY(105vh) rotate(600deg); opacity:0; }
  }
  .confetti-piece.big{ width:12px; height:20px; }

  .big-deal-banner{
    position:fixed; top:16%; left:50%; transform: translate(-50%, -20px) scale(0.9);
    opacity:0; transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s ease;
    background: linear-gradient(135deg, #1F3A5F, #2c5182);
    color:#fff; border-radius:14px; padding:22px 36px; text-align:center;
    box-shadow: 0 20px 50px rgba(20,30,45,.4); z-index:300;
  }
  .big-deal-banner.show{ opacity:1; transform: translate(-50%, 0) scale(1); }
  .big-deal-emoji{ font-size:34px; }
  .big-deal-text{ font-size:15px; font-weight:700; margin-top:4px; }
  .big-deal-amount{ font-size:26px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:#F6C453; margin-top:4px; }
  .big-deal-name{ font-size:12px; opacity:.85; margin-top:4px; }

  #lostToggleWrap{ padding:12px 28px 0; }
  #lostToggleWrap button{ background:none; border:none; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; font-family:inherit; padding:0; }
  #lostCol{ display:none; }

  .overlay{ display:none; position:fixed; inset:0; background:rgba(20,28,38,.45); z-index:50; align-items:flex-start; justify-content:center; padding: 4vh 16px; overflow-y:auto; }
  .overlay.open{ display:flex; }
  .modal{ background:var(--paper); border-radius:10px; width:100%; max-width:600px; padding:24px 24px 20px; box-shadow:0 20px 50px rgba(20,30,45,.3); }
  .modal h2{ margin:0 0 2px; font-size:16.5px; }
  .modal .branch-tag{ display:inline-block; font-size:10.5px; font-weight:600; color:var(--navy); background:var(--navy-soft); padding:1px 7px; border-radius:8px; margin-bottom:8px; }

  .section-label{ font-size:11px; font-weight:700; color:var(--navy); margin:16px 0 8px; border-bottom:1px solid var(--navy-soft); padding-bottom:4px; }
  .readonly-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:12.5px; }
  .readonly-grid .ro-item{ display:flex; flex-direction:column; gap:1px; }
  .readonly-grid .ro-item.full{ grid-column:1/-1; }
  .readonly-grid .ro-label{ font-size:10.5px; color:var(--ink-soft); }
  .readonly-grid .ro-val{ color:var(--ink); }

  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field.full{ grid-column: 1 / -1; }
  .field label{ font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .field input, .field select, .field textarea{
    font-family:inherit; font-size:13px; padding:8px 9px; border:1px solid var(--line);
    border-radius:5px; background:#FBFCFD; color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--navy); }
  .field textarea{ resize:vertical; min-height:44px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
  .modal-conflict{ margin-top:14px; background:var(--red-soft); border:1px solid var(--red); color:var(--red); border-radius:6px; padding:9px 11px; font-size:12px; font-weight:600; }

  @media (max-width: 700px){
    body{ background-size: 20px 20px; }
    header{ flex-direction:column; align-items:stretch; padding:12px 14px; gap:8px; }
    header h1{ font-size:15.5px; }
    .header-right{ width:100%; }
    .header-right #searchBox{ flex:1; min-width:0; width:auto; }
    .header-right .btn{ flex-shrink:0; padding:9px 12px; font-size:12.5px; }

    .filter-panel{ padding:14px; }
    .filter-grid{ grid-template-columns: 1fr; gap:10px; }
    .filter-field-checkbox{ justify-content:flex-start; }
    .filter-panel-actions{ flex-direction:column-reverse; }
    .filter-panel-actions .btn{ width:100%; padding:12px; }

    .field-grid, .readonly-grid{ grid-template-columns:1fr; }

    .board{ padding:14px 14px 30px; gap:12px; }
    .col{ width:80vw; min-width:80vw; scroll-snap-align:start; max-height: calc(100vh - 210px); }
    .board{ scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }

    #summaryBar{ margin:12px 14px 0; padding:10px 12px; gap:12px; }
    #summaryBar .s-val{ font-size:13px; }
    #conflictBanner{ margin:12px 14px 0; font-size:12px; }

    .modal{ padding:18px 16px 16px; max-width:100%; }
    .login-box{ margin:0 16px; padding:28px 24px; }
  }

  #loadingOverlay{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px; padding:70px 20px; color:var(--ink-soft); font-size:13px;
  }
  #loadingOverlay.hidden{ display:none; }
  .spinner{
    width:28px; height:28px; border-radius:50%;
    border:3px solid var(--navy-soft); border-top-color:var(--navy);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #loginScreen{
    position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      var(--bg);
    background-size: 28px 28px;
  }
  #loginScreen.hidden{ display:none; }
  .login-box{
    background:var(--paper); border:1px solid var(--line); border-radius:12px;
    padding:36px 40px; text-align:center; box-shadow:0 20px 50px rgba(20,30,45,.15);
    width:100%; max-width:320px;
  }
  .login-box h1{ font-size:17px; margin:0 0 6px; }
  .login-box p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }
  .login-box input{
    width:100%; font-size:28px; letter-spacing:14px; text-align:center;
    font-family:'IBM Plex Mono', monospace; padding:10px 0; padding-left:14px;
    border:1px solid var(--line); border-radius:8px; background:#FBFCFD; color:var(--ink);
    margin-bottom:10px;
  }
  .login-box input:focus{ outline:none; border-color:var(--navy); }
  .login-box .btn{ width:100%; padding:11px; }
  #pinError{ display:none; color:var(--red); font-size:12px; margin-bottom:10px; }
  #pinError.show{ display:block; }
  .login-box.shake{ animation: shake 0.3s; }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-6px); }
    75%{ transform: translateX(6px); }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <h1>案件進捗ボード</h1>
    <p>4桁のPINを入力してください</p>
    <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" id="pinInput" autocomplete="off">
    <div id="pinError">PINが違います</div>
    <button class="btn btn-primary" id="pinSubmit">開く</button>
  </div>
</div>

<header>
  <div>
    <h1>案件進捗ボード</h1>
    <div class="sub"><span id="lastUpdated">未取得</span></div>
  </div>
  <div class="header-right">
    <input type="text" id="searchBox" placeholder="🔍 検索">
    <button class="btn btn-ghost" id="btnToggleFilters">絞り込み <span id="filterCount" class="filter-count-badge" style="display:none;"></span></button>
    <button class="btn btn-primary" id="btnNew">＋ 新規</button>
  </div>
</header>

<div id="filterPanel" class="filter-panel">
  <div class="filter-grid">
    <div class="filter-field">
      <label>拠点</label>
      <select id="branchFilter"><option value="">すべての拠点</option></select>
    </div>
    <div class="filter-field">
      <label>担当者</label>
      <select id="assigneeFilter"><option value="">すべての担当者</option></select>
    </div>
    <div class="filter-field">
      <label>ランク</label>
      <select id="rankFilter">
        <option value="">すべてのランク</option>
        <option value="S">S</option><option value="A">A</option>
        <option value="B">B</option><option value="C">C</option><option value="E">E</option>
      </select>
    </div>
    <div class="filter-field">
      <label>源泉</label>
      <select id="sourceFilter"><option value="">すべての源泉</option></select>
    </div>
    <div class="filter-field">
      <label>受注予定月</label>
      <select id="orderMonthFilter"><option value="">すべての受注予定月</option></select>
    </div>
    <div class="filter-field">
      <label>並び替え</label>
      <select id="sortSelect">
        <option value="date">日付順（工事日→見積提出日→発生日）</option>
        <option value="occurredDateDesc">発生日が新しい順</option>
        <option value="occurredDateAsc">発生日が古い順</option>
        <option value="amountDesc">金額が大きい順</option>
        <option value="amountAsc">金額が小さい順</option>
        <option value="elapsedDesc">経過日数が長い順</option>
        <option value="elapsedAsc">経過日数が短い順</option>
        <option value="rank">ランク順（S→A→B→C→E）</option>
        <option value="profitRateDesc">粗利率が高い順</option>
        <option value="assignee">担当者順</option>
        <option value="source">源泉（紹介元）順</option>
        <option value="customerName">顧客名順</option>
        <option value="siteName">現場名順</option>
        <option value="projectName">案件名順</option>
        <option value="branch">拠点順</option>
        <option value="expectedOrderMonth">受注予定月順</option>
        <option value="dealNo">案件No順</option>
      </select>
    </div>
    <div class="filter-field">
      <label>金額範囲（円）</label>
      <span class="amt-range">
        <input type="number" id="minAmount" placeholder="下限">
        〜
        <input type="number" id="maxAmount" placeholder="上限">
      </span>
    </div>
    <div class="filter-field">
      <label>除外キーワード</label>
      <input type="text" id="excludeBox" placeholder="🚫 例：パナソニックHVAC">
    </div>
    <div class="filter-field filter-field-checkbox">
      <label class="checkbox-label">
        <input type="checkbox" id="conflictOnlyCheck"> 工事日重複のみ表示
      </label>
    </div>
  </div>
  <div class="filter-panel-actions">
    <button class="btn btn-ghost" id="btnReset">条件をリセット</button>
    <button class="btn btn-primary" id="btnCloseFilters">閉じる</button>
  </div>
</div>

<div id="conflictBanner"></div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div id="loadingText">読み込み中…</div>
</div>

<div id="summaryBar"></div>

<div class="board" id="board" style="display:none;">
  <div class="col" data-status="">
    <div class="col-head">
      <div class="col-head-top"><span class="label">📋 未設定</span><span class="count mono" id="cnt-未設定">0</span></div>
      <div class="col-amt mono" id="amt-未設定"></div>
    </div>
    <div class="col-body" id="col-未設定"></div>
  </div>
  <div class="col" data-status="見積中">
    <div class="col-head">
      <div class="col-head-top"><span class="label">📝 見積提出済</span><span class="count mono" id="cnt-見積中">0</span></div>
      <div class="col-amt mono" id="amt-見積中"></div>
    </div>
    <div class="col-body" id="col-見積中"></div>
  </div>
  <div class="col" data-status="受注">
    <div class="col-head">
      <div class="col-head-top"><span class="label">🤝 受注</span><span class="count mono" id="cnt-受注">0</span></div>
      <div class="col-amt mono" id="amt-受注"></div>
    </div>
    <div class="col-body" id="col-受注"></div>
  </div>
  <div class="col" data-status="工事中">

<script>
// ==== 設定：GASウェブアプリのURLをここに設定してください ====
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbzzgwCPn7IFOo92J7GoY5p3oYY0pMILkWj4CiOLqsYBmOpYw-9XWRWuIZsQhv1GJFo6vA/exec';

let deals = [];
let showLost = false;
let branchFilterVal = '';
let assigneeFilterVal = '';
let rankFilterVal = '';
let searchVal = '';
let excludeVal = '';
let sourceFilterVal = '';
let orderMonthFilterVal = '';
let minAmountVal = '';
let maxAmountVal = '';
let conflictOnlyVal = false;
let sortSelectVal = 'date';

function gasGet(action, params={}){
  const qs = new URLSearchParams({ action, ...params }).toString();
  return fetch(`${WEBAPP_URL}?${qs}`).then(r => r.json());
}
function gasPost(action, payload){
  return fetch(WEBAPP_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, payload })
  }).then(r => r.json());
}

// 経過時間（＋Content-Lengthが取れれば%）を表示しながら取得する
async function gasGetWithProgress(action, onProgress){
  const url = `${WEBAPP_URL}?${new URLSearchParams({ action }).toString()}`;
  const start = Date.now();
  const timer = setInterval(() => {
    onProgress({ elapsed: (Date.now() - start) / 1000, percent: null });
  }, 200);

  try{
    const res = await fetch(url);
    const contentLength = res.headers.get('Content-Length');

    if(contentLength && res.body && res.body.getReader){
      const total = parseInt(contentLength, 10);
      let loaded = 0;
      const reader = res.body.getReader();
      const chunks = [];
      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        chunks.push(value);
        loaded += value.length;
        onProgress({ elapsed: (Date.now() - start) / 1000, percent: Math.min(99, Math.round(loaded / total * 100)) });
      }
      const text = await new Blob(chunks).text();
      onProgress({ elapsed: (Date.now() - start) / 1000, percent: 100 });
      return JSON.parse(text);
    } else {
      const json = await res.json();
      onProgress({ elapsed: (Date.now() - start) / 1000, percent: 100 });
      return json;
    }
  } finally {
    clearInterval(timer);
  }
}

function fmtYen(n){
  if(n === '' || n === undefined || n === null || isNaN(n)) return '';
  return '¥' + Number(n).toLocaleString('ja-JP');
}
// スプレッドシートの%セルは小数(0.25など)で入ってくるため、%表記に変換する
function toPercentNumber(v){
  if(v === '' || v === undefined || v === null || isNaN(v)) return null;
  let n = Number(v);
  if(Math.abs(n) <= 1) n = n * 100;
  return n;
}
function fmtPercent(v){
  const n = toPercentNumber(v);
  return n === null ? '' : (Math.round(n * 10) / 10) + '%';
}
function profitRateBadge(d){
  const n = toPercentNumber(d.profitRate);
  if(n === null) return '';
  const cls = n < 30 ? 'b-red' : 'b-green';
  return `<span class="badge ${cls}">粗利 ${Math.round(n * 10) / 10}%</span>`;
}
function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return String(d);
  return `${dt.getMonth()+1}/${dt.getDate()}`;
}
function toDateInputVal(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '';
  return dt.toISOString().slice(0,10);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// この金額（円）以上の受注/完了は特別演出にする。変更したい場合はここの数字を書き換えてください
const BIG_DEAL_THRESHOLD = 5000000;

// 受注・完了に案件を動かした時のお祝い演出
function launchConfetti(big){
  const colors = big
    ? ['#D4AF37', '#F6C453', '#C97A2B', '#1F3A5F', '#3F7D58']
    : ['#1F3A5F', '#C97A2B', '#3F7D58', '#B3432B', '#8A97A3'];
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);

  const count = big ? 160 : 60;
  for(let i = 0; i < count; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece' + (big ? ' big' : '');
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (big ? (2 + Math.random() * 1.5) : (1.6 + Math.random() * 1.2)) + 's';
    piece.style.animationDelay = (Math.random() * (big ? 0.6 : 0.3)) + 's';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    container.appendChild(piece);
  }
  setTimeout(() => container.remove(), big ? 4200 : 3200);
}

function showBigDealBanner(deal){
  const banner = document.createElement('div');
  banner.className = 'big-deal-banner';
  banner.innerHTML = `
    <div class="big-deal-emoji">🏆</div>
    <div class="big-deal-text">大型案件です！</div>
    <div class="big-deal-amount">${fmtYen(amountOf(deal))}</div>
    <div class="big-deal-name">${escapeHtml(deal.siteName || deal.customerName || '')}</div>
  `;
  document.body.appendChild(banner);
  setTimeout(() => banner.classList.add('show'), 10);
  setTimeout(() => { banner.classList.remove('show'); setTimeout(() => banner.remove(), 400); }, 3500);
}

function celebrateStatusChange(deal){
  const big = amountOf(deal) >= BIG_DEAL_THRESHOLD;
  launchConfetti(big);
  if(big) showBigDealBanner(deal);
}


function elapsedBadge(deal){
  const days = deal.elapsedDays;
  if(days === null || days === undefined) return '';
  let cls = 'b-green';
  if(days >= 14) cls = 'b-red';
  else if(days >= 7) cls = 'b-amber';
  return `<span class="badge ${cls}">経過${days}日</span>`;
}

// 優先順位：手動ステータス ＞ ランクS(自動で受注) ＞ 見積提出日あり(自動で見積提出済) ＞ 未設定
// 優先順位：手動ステータス ＞ 確定金額あり(自動で完了) ＞ ランクS(自動で受注)
//          ＞ 見積金額 or 見積提出日あり(自動で見積提出済) ＞ 未設定
// 優先順位：手動ステータス ＞ 確定金額あり(完了) ＞ ランクS(受注) ＞ ランクE(失注)
//          ＞ 見積金額 or 見積提出日あり(見積提出済) ＞ 未設定
function effStatus(d){
  if(d.status) return d.status;
  if(d.confirmedAmount !== '' && d.confirmedAmount != null) return '完了';
  if(d.rank === 'S') return '受注';
  if(d.rank === 'E') return '失注';
  if(d.quoteDate || (d.quoteAmount !== '' && d.quoteAmount != null)) return '見積中';
  return '';
}

function findConflicts(){
  const active = deals.filter(d => (effStatus(d) === '受注' || effStatus(d) === '工事中') && d.constructionStart);
  const conflictIds = new Set();
  const pairs = [];
  for(let i=0;i<active.length;i++){
    for(let j=i+1;j<active.length;j++){
      const a = active[i], b = active[j];
      const as = new Date(a.constructionStart).getTime();
      const ae = new Date(a.constructionEnd || a.constructionStart).getTime();
      const bs = new Date(b.constructionStart).getTime();
      const be = new Date(b.constructionEnd || b.constructionStart).getTime();
      if(as <= be && bs <= ae){
        conflictIds.add(a.id); conflictIds.add(b.id);
        pairs.push(`「${a.projectName||a.customerName}」と「${b.projectName||b.customerName}」`);
      }
    }
  }
  return { conflictIds, pairs };
}

function amountOf(d){
  const v = d.confirmedAmount !== '' && d.confirmedAmount != null ? d.confirmedAmount : d.quoteAmount;
  const n = Number(v);
  return isNaN(n) ? 0 : n;
}

function visibleDeals(){
  const kw = searchVal.trim().toLowerCase();
  const exKw = excludeVal.trim().toLowerCase();
  const min = minAmountVal !== '' ? Number(minAmountVal) : null;
  const max = maxAmountVal !== '' ? Number(maxAmountVal) : null;
  const matchFields = d => [d.siteName, d.customerName, d.projectName, d.summary, d.assignee, d.source, d.dealNo];
  return deals.filter(d =>
    (!branchFilterVal || d.branch === branchFilterVal) &&
    (!assigneeFilterVal || d.assignee === assigneeFilterVal) &&
    (!rankFilterVal || d.rank === rankFilterVal) &&
    (!sourceFilterVal || d.source === sourceFilterVal) &&
    (!orderMonthFilterVal || d.expectedOrderMonth === orderMonthFilterVal) &&
    (min === null || amountOf(d) >= min) &&
    (max === null || amountOf(d) <= max) &&
    (!kw || matchFields(d).some(v => String(v||'').toLowerCase().includes(kw))) &&
    (!exKw || !matchFields(d).some(v => String(v||'').toLowerCase().includes(exKw)))
  );
}

function populateFilters(){
  const branchSel = document.getElementById('branchFilter');
  const assigneeSel = document.getElementById('assigneeFilter');
  const sourceSel = document.getElementById('sourceFilter');
  const orderMonthSel = document.getElementById('orderMonthFilter');
  const branches = [...new Set(deals.map(d => d.branch))].sort();
  const assignees = [...new Set(deals.map(d => d.assignee).filter(Boolean))].sort();
  const sources = [...new Set(deals.map(d => d.source).filter(Boolean))].sort();
  const orderMonths = [...new Set(deals.map(d => d.expectedOrderMonth).filter(Boolean))].sort();

  const curBranch = branchSel.value, curAssignee = assigneeSel.value, curSource = sourceSel.value, curOrderMonth = orderMonthSel.value;
  branchSel.innerHTML = '<option value="">すべての拠点</option>' + branches.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
  assigneeSel.innerHTML = '<option value="">すべての担当者</option>' + assignees.map(a => `<option value="${escapeHtml(a)}">${escapeHtml(a)}</option>`).join('');
  sourceSel.innerHTML = '<option value="">すべての源泉</option>' + sources.map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  orderMonthSel.innerHTML = '<option value="">すべての受注予定月</option>' + orderMonths.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
  branchSel.value = curBranch; assigneeSel.value = curAssignee; sourceSel.value = curSource; orderMonthSel.value = curOrderMonth;
}

function updateFilterCountBadge(){
  const count = [
    branchFilterVal, assigneeFilterVal, rankFilterVal, sourceFilterVal, orderMonthFilterVal,
    minAmountVal, maxAmountVal, excludeVal, conflictOnlyVal ? 'x' : ''
  ].filter(Boolean).length;
  const badge = document.getElementById('filterCount');
  if(count > 0){
    badge.textContent = count;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

function render(){
  updateFilterCountBadge();
  let visible = visibleDeals();
  const { conflictIds, pairs } = findConflicts();
  if(conflictOnlyVal) visible = visible.filter(d => conflictIds.has(d.id));

  const banner = document.getElementById('conflictBanner');
  if(pairs.length){
    banner.style.display = 'block';
    banner.innerHTML = `⚠ 工事日が重複しています： <span class="detail">${pairs.join(' / ')}</span>`;
  } else {
    banner.style.display = 'none';
  }

  const RANK_ORDER = { 'S':0, 'A':1, 'B':2, 'C':3, 'E':4 };
  function sortDeals(list){
    const sorted = list.slice();
    const byText = (f) => (a,b) => String(a[f]||'').localeCompare(String(b[f]||''), 'ja');
    const byDate = (f, desc) => (a,b) => {
      const av = a[f] ? new Date(a[f]).getTime() : (desc ? -Infinity : Infinity);
      const bv = b[f] ? new Date(b[f]).getTime() : (desc ? -Infinity : Infinity);
      return desc ? bv - av : av - bv;
    };
    switch(sortSelectVal){

      case 'amountDesc':
        sorted.sort((a,b) => amountOf(b) - amountOf(a)); break;
      case 'amountAsc':
        sorted.sort((a,b) => amountOf(a) - amountOf(b)); break;
      case 'elapsedDesc':
        sorted.sort((a,b) => (b.elapsedDays ?? -1) - (a.elapsedDays ?? -1)); break;
      case 'elapsedAsc':
        sorted.sort((a,b) => (a.elapsedDays ?? 999999) - (b.elapsedDays ?? 999999)); break;
      case 'rank':
        sorted.sort((a,b) => (RANK_ORDER[a.rank] ?? 99) - (RANK_ORDER[b.rank] ?? 99)); break;
      case 'profitRateDesc':
        sorted.sort((a,b) => (parseFloat(b.profitRate) || -Infinity) - (parseFloat(a.profitRate) || -Infinity)); break;
      case 'assignee':
        sorted.sort(byText('assignee')); break;
      case 'source':
        sorted.sort(byText('source')); break;
      case 'customerName':
        sorted.sort(byText('customerName')); break;
      case 'siteName':
        sorted.sort(byText('siteName')); break;
      case 'projectName':
        sorted.sort(byText('projectName')); break;
      case 'branch':
        sorted.sort(byText('branch')); break;
      case 'expectedOrderMonth':
        sorted.sort(byText('expectedOrderMonth')); break;
      case 'dealNo':
        sorted.sort(byText('dealNo')); break;
      case 'occurredDateDesc':
        sorted.sort(byDate('occurredDate', true)); break;
      case 'occurredDateAsc':
        sorted.sort(byDate('occurredDate', false)); break;
      case 'date':
      default:
        sorted.sort((a,b) => (a.constructionStart||a.quoteDate||a.occurredDate||'').toString().localeCompare((b.constructionStart||b.quoteDate||b.occurredDate||'').toString()));
    }
    return sorted;
  }

  ['', '見積中','受注','工事中','完了','失注'].forEach(status => {
    const list = sortDeals(visible.filter(d => effStatus(d) === status));
    const key = status || '未設定';
    document.getElementById(`cnt-${key}`).textContent = list.length;
    const colTotal = list.reduce((sum, d) => sum + amountOf(d), 0);
    document.getElementById(`amt-${key}`).textContent = colTotal ? fmtYen(colTotal) : '';
    const body = document.getElementById(`col-${key}`);
    body.innerHTML = '';
    list.forEach(d => body.appendChild(renderCard(d, conflictIds.has(d.id), justUpdatedIds.has(d.id))));
  });

  // 全体サマリー（現在の絞り込み条件・失注表示設定を反映）
  const summaryDeals = showLost ? visible : visible.filter(d => effStatus(d) !== '失注');
  const totalQuote = summaryDeals.reduce((s,d) => s + (Number(d.quoteAmount)||0), 0);
  const totalConfirmed = summaryDeals.filter(d => d.confirmedAmount !== '' && d.confirmedAmount != null)
    .reduce((s,d) => s + (Number(d.confirmedAmount)||0), 0);
  const totalAll = summaryDeals.reduce((s,d) => s + amountOf(d), 0);
  document.getElementById('summaryBar').innerHTML = `
    <div class="s-item"><span class="s-label">表示中の件数</span><span class="s-val">${summaryDeals.length}件</span></div>
    <div class="s-item"><span class="s-label">合計金額（確定優先）</span><span class="s-val">${fmtYen(totalAll)}</span></div>
    <div class="s-item"><span class="s-label">見積金額合計</span><span class="s-val">${fmtYen(totalQuote)}</span></div>
    <div class="s-item"><span class="s-label">確定金額合計</span><span class="s-val">${fmtYen(totalConfirmed)}</span></div>
  `;

  document.getElementById('lostCol').style.display = showLost ? 'flex' : 'none';
}

function fmtDateTime(d){
  if(!d) return '';
  const dt = new Date(d);
  if(isNaN(dt.getTime())) return '';
  return `${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`;
}

function renderCard(d, hasConflict, justUpdated){
  const el = document.createElement('div');
  el.className = 'card' + (justUpdated ? ' just-updated' : '');
  el.draggable = true;
  el.dataset.id = d.id;

  let dateLine = '';
  if(d.constructionStart) dateLine = `工事 ${fmtDate(d.constructionStart)}〜${fmtDate(d.constructionEnd)}`;
  else if(d.quoteDate) dateLine = `見積 ${fmtDate(d.quoteDate)}`;
  else if(d.occurredDate) dateLine = `発生 ${fmtDate(d.occurredDate)}`;

  const hasConfirmed = d.confirmedAmount !== '' && d.confirmedAmount != null;
  const amountLine = hasConfirmed
    ? `<span class="amt">確定 ${fmtYen(d.confirmedAmount)}</span>`
    : `<span class="amt">見積 ${fmtYen(d.quoteAmount)}</span>`;
  const subAmount = (hasConfirmed && d.quoteAmount)
    ? `<span class="badge b-grey mono">見積時 ${fmtYen(d.quoteAmount)}</span>` : '';

  el.innerHTML = `
    ${justUpdated ? `<div class="updated-flag">✨ 更新されました</div>` : ''}
    <span class="branch-tag">${escapeHtml(d.branch)}</span>
    <div class="cname">${escapeHtml(d.siteName || d.projectName || '(現場未設定)')}</div>
    <div class="pname">${escapeHtml(d.customerName||'')}${d.projectName && d.siteName ? '　' + escapeHtml(d.projectName) : ''}</div>
    <div class="row">
      ${amountLine}
      ${subAmount}
    </div>
    <div class="row">
      ${d.rank ? `<span class="badge b-grey">${escapeHtml(d.rank)}</span>` : ''}
      ${profitRateBadge(d)}
      ${elapsedBadge(d)}
    </div>
    <div class="row mono" style="color:var(--ink-soft); font-size:10.5px;">
      <span>${dateLine}</span>
      ${d.assignee ? `<span>${escapeHtml(d.assignee)}</span>` : ''}
    </div>
    ${d.currentStatus ? `<div class="legacy-status">${escapeHtml(d.currentStatus)}</div>` : ''}
    ${d.updatedAt ? `<div class="updated-at mono">更新 ${fmtDateTime(d.updatedAt)}</div>` : ''}
    ${hasConflict ? `<div class="conflict-flag">⚠ 工事日が他案件と重複</div>` : ''}
  `;

  el.addEventListener('click', () => openModal(d));
  el.addEventListener('dragstart', () => el.classList.add('dragging'));
  el.addEventListener('dragend', () => el.classList.remove('dragging'));
  return el;
}

// ==== ドラッグ&ドロップでステータス変更 ====
document.querySelectorAll('.col-body').forEach(body => {
  body.addEventListener('dragover', e => { e.preventDefault(); body.closest('.col').classList.add('dragover'); });
  body.addEventListener('dragleave', () => body.closest('.col').classList.remove('dragover'));
  body.addEventListener('drop', async e => {
    e.preventDefault();
    body.closest('.col').classList.remove('dragover');
    const dragging = document.querySelector('.card.dragging');
    if(!dragging) return;
    const id = dragging.dataset.id;
    const newStatus = body.closest('.col').dataset.status;
    const deal = deals.find(d => d.id === id);
    if(!deal || (deal.status||'') === newStatus) return;

    if(newStatus === '失注' && !deal.lostReason){
      const reason = prompt('失注理由を入力してください：');
      if(reason === null) return;
      deal.lostReason = reason;
    }
    if(newStatus === '受注' && !deal.winFactor){
      const factor = prompt('受注の決め手を入力してください：');
      if(factor === null) return;
      deal.winFactor = factor;
    }
    deal.status = newStatus;
    render();
    if(newStatus === '受注' || newStatus === '完了'){
      celebrateStatusChange(deal);
    }
    const res = await gasPost('deal_extra_upsert', deal);
    if(res.status === 'success' && res.data.conflicts && res.data.conflicts.length){
      alert('注意：工事日が以下の案件と重複しています。\n' +
        res.data.conflicts.map(c => `・${c.id}（${fmtDate(c.constructionStart)}〜${fmtDate(c.constructionEnd)}）`).join('\n'));
    }
  });
});

// ==== モーダル ====
const overlay = document.getElementById('overlay');
const BRANCHES = ['営業部','営業部（ビルメン）','１課','２課','３課','函館','旭川'];
const coreFields = ['dealNo','assignee','customerName','siteName','projectName','summary','occurredDate','rank','quoteAmount','confirmedAmount','expectedOrderMonth','profitRate','currentStatus','pendingIssue'];
const editFields = ['status','quoteDate','lostReason','winFactor','constructionStart','constructionEnd','supplier','purchaseDate','purchaseAmount','billingMonth'];
let currentDeal = null;
let isNewMode = false;

function clearForm(){
  coreFields.forEach(f => { const el = document.getElementById('c-' + f); if(el) el.value = ''; });
  editFields.forEach(f => { const el = document.getElementById('f-' + f); if(el) el.value = ''; });
}

function openNewModal(){
  currentDeal = null;
  isNewMode = true;
  document.getElementById('m-branch').textContent = '';
  document.getElementById('modalTitle').textContent = '新規案件';
  document.getElementById('f-id').value = '';
  clearForm();

  const branchSel = document.getElementById('c-branch');
  branchSel.innerHTML = BRANCHES.map(b => `<option value="${escapeHtml(b)}">${escapeHtml(b)}</option>`).join('');
  document.getElementById('newBranchField').style.display = 'block';
  document.getElementById('dealNoLabel').textContent = '案件No（空欄なら自動採番）';

  document.getElementById('modalConflict').style.display = 'none';
  overlay.classList.add('open');
}

function openModal(deal){
  currentDeal = deal;
  isNewMode = false;
  document.getElementById('newBranchField').style.display = 'none';
  document.getElementById('dealNoLabel').textContent = '案件No';
  document.getElementById('m-branch').textContent = deal.branch;
  document.getElementById('modalTitle').textContent = deal.projectName || deal.customerName || '案件詳細';
  document.getElementById('f-id').value = deal.id;

  coreFields.forEach(f => {
    const el = document.getElementById('c-' + f);
    if(!el) return;
    if(f === 'occurredDate'){ el.value = toDateInputVal(deal[f]); return; }
    el.value = deal[f] !== undefined && deal[f] !== null ? deal[f] : '';
  });

  editFields.forEach(f => {
    const el = document.getElementById('f-' + f);
    if(f === 'quoteDate' || f === 'constructionStart' || f === 'constructionEnd' || f === 'purchaseDate'){
      el.value = toDateInputVal(deal[f]);
    } else {
      el.value = deal[f] || '';
    }
  });

  document.getElementById('modalConflict').style.display = 'none';
  overlay.classList.add('open');
}
function closeModal(){ overlay.classList.remove('open'); currentDeal = null; isNewMode = false; }

document.getElementById('btnNew').addEventListener('click', openNewModal);

document.getElementById('btnToggleFilters').addEventListener('click', () => {
  document.getElementById('filterPanel').classList.toggle('open');
});

});

document.getElementById('btnSave').addEventListener('click', async () => {
  const btn = document.getElementById('btnSave');
  btn.disabled = true; btn.textContent = '保存中…';

  try{
    if(isNewMode){
      const branch = document.getElementById('c-branch').value;
      if(!branch){ alert('拠点を選択してください'); return; }
      const createData = { branch };
      coreFields.forEach(f => { createData[f] = document.getElementById('c-' + f).value; });

      const createRes = await gasPost('deal_core_create', createData);
      if(createRes.status !== 'success'){ alert('作成に失敗しました：' + createRes.data); return; }

      const newId = createRes.data.id;
      const extraData = { id: newId };
      editFields.forEach(f => { extraData[f] = document.getElementById('f-' + f).value; });
      const extraRes = await gasPost('deal_extra_upsert', extraData);
      if(extraRes.status !== 'success'){ alert('追加情報の保存に失敗しました：' + extraRes.data); }
      await loadDeals();
      closeModal();
      return;
    }

    const id = document.getElementById('f-id').value;
    const origDealNo = currentDeal.dealNo;
    const newDealNo = document.getElementById('c-dealNo').value;

    const coreData = { id, branch: currentDeal.branch, rowNum: currentDeal.rowNum, origDealNo: origDealNo };
    coreFields.forEach(f => { coreData[f] = document.getElementById('c-' + f).value; });

    const coreRes = await gasPost('deal_core_update', coreData);
    if(coreRes.status !== 'success'){ alert('基本情報の保存に失敗しました：' + coreRes.data); return; }

    // 案件Noを変更した場合は、追加情報の紐付けIDも新しいものを使う（バックエンド側で付け替え済み）
    const newId = (newDealNo !== origDealNo) ? (currentDeal.branch + '::' + newDealNo) : id;

    const extraData = { id: newId };
    editFields.forEach(f => { extraData[f] = document.getElementById('f-' + f).value; });

    const prevStatus = effStatus(currentDeal);
    const newStatusVal = extraData.status || prevStatus;

    const extraRes = await gasPost('deal_extra_upsert', extraData);
    if(extraRes.status !== 'success'){ alert('追加情報の保存に失敗しました：' + extraRes.data); return; }
    if(extraRes.data.conflicts && extraRes.data.conflicts.length){
      document.getElementById('modalConflict').style.display = 'block';
      document.getElementById('modalConflict').textContent =
        '⚠ 工事日が重複しています： ' +
        extraRes.data.conflicts.map(c => `${c.id}（${fmtDate(c.constructionStart)}〜${fmtDate(c.constructionEnd)}）`).join(' / ');
    }
    if((newStatusVal === '受注' || newStatusVal === '完了') && newStatusVal !== prevStatus){
      celebrateStatusChange(Object.assign({}, currentDeal, extraData));
    }
    await loadDeals();
    closeModal();
  } finally {
    btn.disabled = false; btn.textContent = '保存';
  }
});


// ==== 初期ロード＋自動更新 ====
let isFirstLoad = true;
let prevDealsMap = {};
let justUpdatedIds = new Set();
const loadingOverlay = document.getElementById('loadingOverlay');
const loadingText = document.getElementById('loadingText');

// elapsedDaysは日をまたぐだけで変わるので比較対象から除外する
function snapshotKey(d){
  const { elapsedDays, ...rest } = d;
  return JSON.stringify(rest);
}

async function loadDeals(){
  const showOverlay = isFirstLoad;
  if(showOverlay){
    loadingOverlay.classList.remove('hidden');
    document.getElementById('board').style.display = 'none';
  }

  const onProgress = ({ elapsed, percent }) => {
    if(!showOverlay) return;
    const secs = elapsed.toFixed(1);
    loadingText.textContent = (percent !== null && percent !== undefined)
      ? `読み込み中… ${percent}%（${secs}秒経過）`
      : `読み込み中… ${secs}秒経過（7拠点分を集計しています）`;
  };

  const res = await gasGetWithProgress('deal_list', onProgress);

  if(res.status === 'success'){
    // 初回以降は、前回取得内容と比べて変化があったカードを検知してハイライトする
    if(!isFirstLoad && Object.keys(prevDealsMap).length){
      justUpdatedIds = new Set();
      res.data.forEach(d => {
        const prev = prevDealsMap[d.id];
        if(prev !== undefined && prev !== snapshotKey(d)) justUpdatedIds.add(d.id);
      });
    } else {
      justUpdatedIds = new Set();
    }
    prevDealsMap = {};
    res.data.forEach(d => { prevDealsMap[d.id] = snapshotKey(d); });

    deals = res.data;
    populateFilters();
    render();
    const now = new Date();
    document.getElementById('lastUpdated').textContent =
      '最終更新 ' + String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');

    // ハイライトは一定時間で自動的に消す（次回描画時に残らないように）
    if(justUpdatedIds.size){
      setTimeout(() => { justUpdatedIds = new Set(); render(); }, 4000);
    }
  } else {
    console.error(res.data);
    if(showOverlay) loadingText.textContent = '読み込みに失敗しました：' + res.data;
  }

  if(showOverlay){
    loadingOverlay.classList.add('hidden');
    document.getElementById('board').style.display = 'flex';
    isFirstLoad = false;
  }
}

const POLL_INTERVAL_MS = 30000;
function startPolling(){
  setInterval(() => {
    if(overlay.classList.contains('open')) return;
    if(document.querySelector('.card.dragging')) return;
    loadDeals();
  }, POLL_INTERVAL_MS);
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && !overlay.classList.contains('open')) loadDeals();
  });
}

// ここのPINを変更したい場合は下の文字列を書き換えてください
const APP_PIN = '8686';
const PIN_STORAGE_KEY = 'sinchoku_pin_ok';

function startApp(){
  if(WEBAPP_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('board').innerHTML =
      '<div style="padding:40px; color:var(--ink-soft);">WEBAPP_URL が未設定です。index.html内のWEBAPP_URLにGASデプロイURLを設定してください。</div>';
    document.getElementById('board').style.display = 'flex';
  } else {
    loadDeals();
    startPolling();
  }
}

function tryLogin(){
  const input = document.getElementById('pinInput');
  const errEl = document.getElementById('pinError');
  if(input.value === APP_PIN){
    try{ sessionStorage.setItem(PIN_STORAGE_KEY, 'yes'); }catch(e){}
    document.getElementById('loginScreen').classList.add('hidden');
    startApp();
  } else {
    errEl.classList.add('show');
    const box = document.querySelector('.login-box');
    box.classList.remove('shake');
    void box.offsetWidth; // reflow でアニメーションを再トリガー
    box.classList.add('shake');
    input.value = '';
    input.focus();
  }
}

document.getElementById('pinSubmit').addEventListener('click', tryLogin);
document.getElementById('pinInput').addEventListener('keydown', e => { if(e.key === 'Enter') tryLogin(); });
document.getElementById('pinInput').addEventListener('input', e => {
  e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0,4);
});

let alreadyAuthed = false;
try{ alreadyAuthed = sessionStorage.getItem(PIN_STORAGE_KEY) === 'yes'; }catch(e){}

if(alreadyAuthed){
  document.getElementById('loginScreen').classList.add('hidden');
  startApp();
} else {
  document.getElementById('pinInput').focus();
}
